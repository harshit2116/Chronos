[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-crisis"
version = "0.2.0"
description = "Event-driven, multi-agent crisis simulation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chronos = "chronos.cli:main"
chronos-web = "chronos.web:main"

[tool.setuptools.packages.find]
include = ["chronos*"]

[tool.setuptools.package-data]
chronos = ["*.html", "*.css", "*.js"]
